<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Bohne – Das Gewächshaus erwacht</title><style>
:root{font-family:system-ui,sans-serif;color:#193d32;background:#edf4ee}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;min-height:46px;border:0;border-radius:12px;padding:12px 18px;background:#20664c;color:white;font-weight:700}button:hover{filter:brightness(1.08)}button:focus-visible,select:focus-visible{outline:3px solid #d79725;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.secondary{background:#e3eee7;color:#193d32}header{background:#173e32;color:white;padding:22px max(20px,calc((100vw - 1000px)/2))}header p{color:#bcd8ca;margin:5px 0}h1{font-size:clamp(24px,4vw,36px);margin:0}main{max-width:1000px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between}.bar{height:10px;background:#d2e3d8;border-radius:20px;margin:12px 0 18px;overflow:hidden}.bar span{display:block;height:100%;background:#378560;transition:width .4s}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav button{flex:1;white-space:nowrap;font-size:14px}nav .active{background:#dab566;color:#283b29}.card{background:white;border:1px solid #d8e6dc;border-radius:22px;padding:clamp(18px,3vw,32px);box-shadow:0 10px 35px #143a2910}h2{margin:0 0 10px;font-size:25px}p{line-height:1.6}.tag{font-size:12px;letter-spacing:1px;font-weight:800;color:#577366;text-transform:uppercase;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.field{display:block;margin:12px 0;line-height:1.4}.field span{display:block;margin-bottom:7px;font-weight:600}select{width:100%;padding:12px;border-radius:10px;border:1px solid #a6bdb0;background:#f7faf7;color:#193d32;min-height:46px}.feedback{padding:15px;border-radius:12px;margin-top:18px;background:#f5eedb;line-height:1.5}.feedback.ok{background:#e0f1e4}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hint{margin-top:15px;color:#536b5e}.order{display:flex;align-items:center;gap:10px;background:#f0f6f1;padding:10px;border-radius:12px;margin:9px 0}.order span{flex:1}.order button{padding:8px 12px}.choice{display:flex;gap:12px;align-items:start;background:#f0f6f1;padding:15px;margin:10px 0;border-radius:12px;line-height:1.5}.choice input{width:22px;height:22px;flex-shrink:0;accent-color:#20664c}.scene{background:linear-gradient(#e9f5ee 65%,#ded1b9 65%);border-radius:18px;padding:20px;text-align:center}svg{max-width:100%;height:auto}.big{font-size:65px}.note{font-size:13px;color:#5c7166}summary{cursor:pointer;padding:12px;font-weight:650}textarea{width:100%;min-height:90px;font:inherit;padding:12px;border:1px solid #a6bdb0;border-radius:10px}@media(max-width:680px){.grid{grid-template-columns:1fr}.top{align-items:start}main{padding:12px}header{padding:18px}nav button{flex:1 1 28%}.card{padding:18px}}

.story{border-left:4px solid #cfad65;background:#f6f0df;padding:14px 18px;border-radius:10px;margin:16px 0}.story strong{display:block;color:#725724}.growthbox{position:fixed;inset:0;background:#10291de0;z-index:20;display:grid;place-items:center;padding:18px;overflow:auto}.growthcard{background:#fffdf6;border-radius:24px;padding:24px;max-width:630px;width:100%;max-height:95vh;overflow:auto;box-shadow:0 20px 80px #0005}.growthcard h2{margin-top:8px}.greenhouse{background:linear-gradient(#dcefe9,#fbf6df);border-radius:18px;overflow:hidden}.growroot{stroke-dasharray:260;stroke-dashoffset:260;animation:rootgrow 2.8s ease forwards}.shoot{transform-origin:300px 245px;animation:shootgrow 2.6s ease both}.leaf{transform-box:fill-box;transform-origin:center;animation:unfold 2s .8s ease both}.swell{transform-box:fill-box;transform-origin:center;animation:swell 2.6s ease both}.droplet{animation:rain 1.8s ease-in infinite}.scanline{animation:scan 3s ease-in-out infinite}.reveal{animation:reveal .8s ease both}@keyframes rootgrow{to{stroke-dashoffset:0}}@keyframes shootgrow{from{transform:scaleY(.06)}to{transform:scaleY(1)}}@keyframes unfold{from{transform:scale(.03);opacity:0}to{transform:scale(1);opacity:1}}@keyframes swell{from{transform:scale(.72)}to{transform:scale(1)}}@keyframes rain{from{transform:translateY(-35px);opacity:0}40%{opacity:1}to{transform:translateY(35px);opacity:0}}@keyframes scan{0%,100%{transform:translateY(-95px)}50%{transform:translateY(90px)}}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.growroot{animation:none;stroke-dashoffset:0}.shoot,.leaf,.swell,.droplet,.scanline,.reveal{animation:none}}
</style><header><p>FORSCHUNGSSTATION GRÜN • BIOLOGIE</p><h1>Mission Bohne</h1><p>Eine Bohne. Fünf Forschungsaufträge. Deine Rettungsmission.</p></header><main><div class="top"><strong id="progress"></strong><button class="secondary" id="reset">Neu starten</button></div><div class="bar"><span id="bar"></span></div><nav id="nav" aria-label="Forschungsaufträge"></nav><section id="app" class="card"></section><p class="note">Ohne Zeitdruck • Jede gelöste Mission bringt ein Abzeichen • Fortschritt wird, wenn möglich, auf diesem Gerät gespeichert.</p></main><script>
const key='mission-bohne-v1';let state={done:[],current:-1};try{const s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.done)&&s.done.every(n=>Number.isInteger(n)&&n>=0&&n<5)&&Number.isInteger(s.current)&&s.current>=-1&&s.current<=5)state=s}catch(e){}let order=[3,0,4,1,2];let lastFocus=null;
const titles=['Samenscanner','Bauplan retten','Wachstumsarchiv','Steuerung reparieren','Gewächshaus starten'];
const steps=['Der Samen nimmt Wasser auf und quillt.','Die Keimwurzel durchbricht die Samenschale.','Die Keimwurzel bildet Seitenwurzeln; der Stängel wird sichtbar.','Der Stängel richtet sich auf.','Grüne Laubblätter entfalten sich.'];
const diagram=`<svg viewBox="0 0 420 330" role="img" aria-label="Geöffneter Bohnensamen mit fünf nummerierten Teilen"><path d="M203 52 C123 0 78 90 92 223 C104 305 169 319 204 265 C225 306 298 312 321 232 C353 119 315 12 243 42 C224 50 216 67 213 83Z" fill="#bf9769" stroke="#67563b" stroke-width="3"/><path d="M199 65 C135 22 91 99 103 219 C110 286 165 303 193 259 C213 212 204 123 199 65Z" fill="#f3e2a4"/><path d="M238 58 C299 18 335 120 310 227 C293 286 240 294 220 256 C206 207 219 107 238 58Z" fill="#f3e2a4"/><path d="M212 228 C195 188 211 156 217 122" stroke="#668047" stroke-width="10" fill="none"/><path d="M217 124 Q198 91 236 92 Q248 110 217 124 M219 121 Q242 97 254 118 Q237 137 219 121" fill="#719c49" stroke="#466e37" stroke-width="2"/><path d="M211 201 Q226 215 212 248 Q203 233 211 201" fill="#faf1cc" stroke="#6d8151" stroke-width="2"/><g stroke="#274f48" stroke-width="2" fill="none"><path d="M93 185H40"/><path d="M150 137V35H170 M271 140V35H251"/><path d="M241 109L359 65"/><path d="M214 162L364 155"/><path d="M216 230L359 263"/></g><g fill="#20664c"><circle cx="28" cy="185" r="16"/><circle cx="210" cy="30" r="16"/><circle cx="378" cy="59" r="16"/><circle cx="383" cy="155" r="16"/><circle cx="378" cy="271" r="16"/></g><g fill="white" font-size="18" text-anchor="middle" font-family="system-ui"><text x="28" y="191">1</text><text x="210" y="36">2</text><text x="378" y="65">3</text><text x="383" y="161">4</text><text x="378" y="277">5</text></g></svg>`;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function select(id,label,options){return `<label class="field"><span>${label}</span><select id="${id}"><option value="">Bitte wählen …</option>${options.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></label>`}
function controls(hint){return `<div class="actions"><button id="check">Auftrag prüfen</button><button class="secondary" id="hint">Hinweis</button></div><div class="hint" id="hinttext" hidden>${hint}</div><div id="feedback" role="status" aria-live="polite"></div>`}
function render(){save();const n=state.done.length;document.getElementById('progress').textContent=`${n} / 5 Forschungsabzeichen gesammelt`;document.getElementById('bar').style.width=n*20+'%';document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="${state.current===i?'active':'secondary'}" data-go="${i}" ${i>state.done.length?'disabled':''}>${state.done.includes(i)?'✓ ':''}${i+1}. ${t}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.current=+b.dataset.go;render()});const app=document.getElementById('app');
if(state.current===-1){app.innerHTML=`<div class="grid"><div><div class="tag">Dein Forschungsauftrag</div><h2>Kannst du das Gewächshaus retten?</h2><p>Ein Knacken im Funkgerät. Dann eine abgehackte Nachricht: „Gewächshaus 07 … Stromausfall … wir brauchen Hilfe!“ Du öffnest die Tür zur Forschungsstation. Die Bildschirme sind dunkel, die Bewässerung steht still. Nur eine kleine Kontrollleuchte blinkt noch. Daneben entdeckst du eine Pflanzschale – darin liegt eine einzige Bohne. Kannst du die Station wieder zum Leben erwecken und die Bohne retten?</p><p>Auf dem Notfallbildschirm erscheinen fünf Forschungsaufträge. Die Anlage lässt sich nur Schritt für Schritt wiederherstellen – und dafür braucht sie dein Wissen über Samen und Pflanzen. Am Ende zeigt sich, ob deine Rettungsmission gelungen ist!</p><button id="start">Forschung starten →</button><p class="note">Etwa 15–20 Minuten • Wiederholung zum Arbeitsblatt</p></div><div class="scene">${growthSVG(0)}<h3>Gewächshaus 07 · System offline</h3><p>Ein trockener Samen wartet auf deinen Einsatz.</p></div></div>`;document.getElementById('start').onclick=()=>{state.current=0;render()};return}
if(state.current===5){app.innerHTML=`<div class="tag">Mission abgeschlossen</div><h2>Mission geschafft – du hast alle fünf Forschungsaufträge gelöst! 🎉</h2><p>Du hast alle Fragen richtig beantwortet und gezeigt, dass du dich mit dem Aufbau eines Samens und seiner Entwicklung zur Pflanze auskennst. Mit deinem Wissen hast du die Forschungsstation wieder zum Laufen gebracht und die Bohne gerettet!</p><div class="scene">${growthSVG(5)}<strong>Aus einem Samen ist eine junge Pflanze geworden.</strong></div><h3>Das kannst du jetzt erklären</h3><ul><li>Ein Bohnensamen besitzt eine Samenschale und zwei Keimblätter.</li><li>Erste Laubblätter, Keimstängel und Keimwurzel gehören zum Keimling.</li><li>Auf die Quellung folgen Keimung und Wachstum.</li><li>Wasser ist für Quellung und Keimung notwendig.</li></ul><details><summary>Expertenauftrag: Denk einen Schritt weiter</summary><p>Ein Samen liegt auf feuchter Watte. Ein anderer liegt auf trockener Watte. Beide stehen am selben Ort. Was erwartest du? Begründe mit zwei Fachbegriffen.</p><textarea aria-label="Deine Begründung" placeholder="Ich erwarte …, weil …"></textarea><details><summary>Mit einer Beispielantwort vergleichen</summary><p>Auf feuchter Watte kann der Samen Wasser aufnehmen und quellen. Danach kann die Keimung beginnen. Auf trockener Watte fehlt das Wasser: Die Quellung bleibt aus und der Samen keimt unter diesen Bedingungen nicht. Feuchtigkeit allein garantiert jedoch noch keine erfolgreiche Keimung.</p></details></details><button class="secondary" id="review">Aufträge noch einmal ansehen</button>`;document.getElementById('review').onclick=()=>{state.current=0;render()};return}
const i=state.current;let content='';const story=['Der Samenscanner hat beim Stromausfall all seine Beschriftungen verloren. Repariere seine Anzeige.','Der Scanner läuft wieder! Doch auf dem nächsten Bildschirm blinkt eine Fehlermeldung: „Keimling nicht erkannt.“ Hilf der Station: Welche Teile gehören zum Keimling?','Auch im Entwicklungsarchiv der Pflanzen flackert der Bildschirm noch. Die Aufnahmen sind noch da – aber ihre Reihenfolge ist verloren! Kannst du herausfinden, was zuerst passiert und was danach? Bringe die Beobachtungen in die richtige Reihenfolge.','Die Aufnahmen laufen wieder in der richtigen Reihenfolge! Doch die Steuerung meldet: „Entwicklungsphasen unbekannt.“ Zeige ihr, woran sie Quellung, Keimung und Wachstum erkennen kann. Ordne die Beobachtungen der passenden Phase zu.','Eine Kontrollleuchte nach der anderen springt auf Grün. Nur die Bewässerung blinkt noch rot: „Letzte Prüfung erforderlich.“ Zeige, welche Rolle Wasser für den Samen spielt – dann kann das Gewächshaus wieder starten!'][i];if(i===0){const opts=['Keimstängel','Samenschale','Keimwurzel','zwei Keimblätter','erste Laubblätter'];content=`<p>Ordne jeder Nummer den richtigen Begriff zu.</p><div class="grid"><div class="scene">${diagram}<p class="note">Schematische Darstellung eines Bohnensamens</p></div><div>${[1,2,3,4,5].map(n=>select('a'+n,'Teil '+n,opts)).join('')}</div></div>`+controls('Folge jeder Linie bis zu ihrem Ende. Zeigt sie auf die äußere Begrenzung, auf beide großen Hälften oder auf einen Teil der kleinen Pflanzenanlage? Überlege bei den Fachbegriffen, welches Wort eine Lage oder Form verrät.')}
if(i===1){content=`<p>Was gehört zum <strong>Keimling</strong>? Wähle genau die drei Teile aus, die im Arbeitsblatt unter diesem Begriff zusammengefasst sind.</p>${['Samenschale','erste Laubblätter','Keimstängel','Keimwurzel','zwei Keimblätter'].map((t,k)=>`<label class="choice"><input type="checkbox" id="b${k}">${t}</label>`).join('')}`+controls('Überlege, welche Teile gemeinsam die kleine Pflanzenanlage bilden. Welche Strukturen liegen dagegen um sie herum? Vergleiche mit der Abbildung aus Auftrag 1.')}
if(i===2){content=`<p>Die Zeitmaschine hat fünf Beobachtungen vertauscht. Stelle den Ablauf vom Samen zur jungen Pflanze wieder her. Verschiebe die Karten mit den Pfeilen.</p><div id="order"></div>`+controls('Frage dich bei jeder Karte: Was muss schon passiert sein, damit dieser Schritt möglich ist? Können Seitenwurzeln entstehen, bevor eine Wurzel vorhanden ist?')}
if(i===3){content=`<p>Der Phasen-Scanner braucht deine Hilfe: Ordne jede Beobachtung einer Entwicklungsphase zu.</p>${steps.map((s,k)=>select('c'+k,s,['Wachstum','Quellung','Keimung'])).join('')}`+controls('Vergleiche die Beobachtungen mit den drei Phasenüberschriften auf deinem Arbeitsblatt. Wo wird nur der Samen verändert, wo tritt erstmals etwas aus ihm heraus, und wo entwickelt sich die junge Pflanze weiter?')}
if(i===4){content=`<p>Zwei gleichartige Samen stehen unter sonst gleichen, geeigneten Bedingungen. Samen A liegt auf <strong>feuchter</strong>, Samen B auf <strong>trockener</strong> Watte.</p>${select('d0','1. Welcher Samen kann zunächst quellen?',['Samen A','Samen B','Beide ohne Unterschied'])}${select('d1','2. Warum wird dieser Samen größer?',['Er nimmt Wasser auf.','Seine grünen Laubblätter entfalten sich bereits.','Die Samenschale bildet Seitenwurzeln.'])}${select('d2','3. Welche Aussage ist richtig?',['Wasser ist nur für das spätere Wachstum nötig.','Wasser ist für Quellung und Keimung nötig.','Ein trockener Samen beginnt immer sofort zu keimen.'])}${select('d3','4. Welche Beobachtung zeigt im Arbeitsblatt den Beginn der Keimung?',['Der Samen wird durch Wasseraufnahme dicker.','Grüne Laubblätter entfalten sich.','Die Keimwurzel durchbricht die Samenschale.'])}`+controls('Die beiden Samen unterscheiden sich nur in einer Bedingung. Welche ist das? Unterscheide außerdem: Wird der Samen nur größer, oder tritt bereits ein Pflanzenteil aus ihm heraus?')}
app.innerHTML=`<div class="tag">Auftrag ${i+1} / 5 ${state.done.includes(i)?'• Abzeichen erhalten ✓':''}</div><h2>${titles[i]}</h2><div class="story"><strong>Gewächshaus 07 · Funknachricht</strong>${story}</div>${content}`;if(i===2)renderOrder();document.getElementById('hint').onclick=()=>{document.getElementById('hinttext').hidden=false};document.getElementById('check').onclick=check;
}
function renderOrder(){document.getElementById('order').innerHTML=order.map((k,p)=>`<div class="order"><strong>${p+1}.</strong><span>${steps[k]}</span><button class="secondary" data-pos="${p}" data-dir="-1" aria-label="Schritt ${p+1} nach oben" ${p===0?'disabled':''}>↑</button><button class="secondary" data-pos="${p}" data-dir="1" aria-label="Schritt ${p+1} nach unten" ${p===4?'disabled':''}>↓</button></div>`).join('');document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{let p=+b.dataset.pos,q=p+(+b.dataset.dir);[order[p],order[q]]=[order[q],order[p]];renderOrder()})}
function check(){let i=state.current,good=true,missing=false;let errors=[];function values(ids,correct){ids.forEach((id,k)=>{const e=document.getElementById(id);if(e.value==='')missing=true;const ok=e.value===String(correct[k]);e.style.borderColor=ok?'#378560':'#b88830';if(!ok){good=false;errors.push(k+1)}})}
if(i===0)values(['a1','a2','a3','a4','a5'],[1,3,4,0,2]);if(i===1){good=[0,1,2,3,4].every(k=>document.getElementById('b'+k).checked===[1,2,3].includes(k));missing=![0,1,2,3,4].some(k=>document.getElementById('b'+k).checked)}if(i===2)good=order.every((k,p)=>k===p);if(i===3)values(['c0','c1','c2','c3','c4'],[1,2,0,0,0]);if(i===4)values(['d0','d1','d2','d3'],[0,0,1,2]);const f=document.getElementById('feedback');f.className='feedback'+(good?' ok':'');if(!good){f.textContent=missing?'Triff zuerst überall eine Auswahl. Nutze bei Bedarf den Hinweis.':(errors.length?`Prüfe noch einmal ${i===0?'Teil':'Zeile'} ${errors.join(', ')}. Die goldenen Felder passen noch nicht. `:'Der Auftrag ist noch nicht ganz gelöst. ')+['Achte auf die beiden großen Hälften und die Lage der kleinen Pflanzenanlage.','Prüfe deine Auswahl: Gesucht sind drei Teile der kleinen Pflanzenanlage, nicht ihre Umgebung.','Noch stimmt die Reihenfolge nicht. Vergleiche jeweils zwei benachbarte Karten: Welcher Schritt ist die Voraussetzung für den anderen?','Unterscheide Wasseraufnahme, Austreten der Keimwurzel und die späteren Wachstumsschritte.','Vergleiche die Bedingungen der beiden Samen und überprüfe die Grenze zwischen Quellung und Keimung auf deinem Arbeitsblatt.'][i];return}
const newlySolved=!state.done.includes(i);if(newlySolved)state.done.push(i);save();document.getElementById('progress').textContent=`${state.done.length} / 5 Forschungsabzeichen gesammelt`;document.getElementById('bar').style.width=state.done.length*20+'%';const messages=['Alle fünf Teile sind richtig beschriftet. Deine Bohne besitzt eine Samenschale, zwei Keimblätter und den Keimling.','Richtig! Erste Laubblätter, Keimstängel und Keimwurzel gehören zum Keimling.','Die Entwicklung ist richtig geordnet: Wasseraufnahme → Keimwurzel tritt aus → Seitenwurzeln und sichtbarer Stängel → Aufrichten → Laubblätter.','Quellung, Keimung und Wachstum sind richtig zugeordnet.','Richtig! Ohne Wasser können Quellung und Keimung nicht beginnen.'];f.innerHTML=`<strong>Abzeichen gesichert! ✓</strong><p>${messages[i]}</p><button id="next">${state.done.length===5?'Gewächshaus öffnen 🌿':'Nächster offener Auftrag →'}</button>`;document.getElementById('next').onclick=()=>{state.current=state.done.length===5?5:[0,1,2,3,4].find(k=>!state.done.includes(k));render()};document.querySelectorAll('[data-go]').forEach(b=>b.disabled=+b.dataset.go>state.done.length);if(newlySolved)showGrowth(state.done.length);document.querySelector(`[data-go="${i}"]`).textContent='✓ '+(i+1)+'. '+titles[i];}

function growthSVG(stage){return `<svg viewBox="0 0 600 345" role="img" aria-label="Gewächshaus – Beobachtung ${stage} von 5"><path d="M60 275V90L300 20L540 90V275M60 90H540M180 58V275M420 58V275M300 20V275" fill="none" stroke="#91b6a5" stroke-width="7"/><path d="M100 255H500L474 330H126Z" fill="#c0845a"/><ellipse cx="300" cy="255" rx="200" ry="22" fill="#72513b"/><path d="M130 271H470" stroke="#e1b28d" stroke-width="7"/>${stage>=2?`<g fill="none" stroke="#f6e2ba" stroke-width="5" stroke-linecap="round"><path class="growroot" d="M300 252 Q280 274 300 299 Q307 310 298 320"/>${stage>=3?'<path class="growroot" d="M292 283L263 295 M302 298L330 311 M296 307L274 318"/>':''}</g>`:''}${stage>=3?`<g class="shoot"><path d="${stage===3?'M300 246Q330 238 321 213Q315 201 303 214':'M300 248Q303 202 300 137'}" stroke="#4a844f" stroke-width="9" fill="none" stroke-linecap="round"/>${stage>=4?'<ellipse cx="283" cy="163" rx="16" ry="25" fill="#c9ae71" transform="rotate(-38 283 163)"/><ellipse cx="317" cy="163" rx="16" ry="25" fill="#d8bd83" transform="rotate(38 317 163)"/>':''}${stage===5?'<g class="leaf"><path d="M300 139Q251 146 244 102Q292 98 300 139" fill="#52934e"/><path d="M300 136Q349 143 357 97Q310 94 300 136" fill="#70aa57"/><path d="M299 137L261 114 M301 135L341 110" stroke="#366a3d" stroke-width="2"/></g>':''}</g>`:''}${stage<=3?`<g class="${stage===1?'swell':''}"><path d="M278 225C269 201 296 184 314 204C330 220 327 241 308 247C290 257 277 245 278 225Z" fill="#e2cc98" stroke="#947344" stroke-width="3"/><path d="M285 226Q295 212 310 219" stroke="#ad8c57" stroke-width="4" fill="none"/></g>`:''}${stage===1?'<g fill="#69a8c9"><path class="droplet" d="M270 135Q252 159 270 163Q288 159 270 135"/><path class="droplet" d="M333 157Q315 181 333 185Q351 181 333 157"/></g>':''}<rect x="422" y="163" width="58" height="65" rx="8" fill="#214e3e"/><circle cx="438" cy="181" r="5" fill="${stage?'#9bcf88':'#e4ab70'}"/><text x="451" y="210" text-anchor="middle" fill="white" font-size="16">${stage}/5</text></svg>`}
function showGrowth(stage){lastFocus=document.activeElement;const box=document.createElement('div');box.className='growthbox';box.id='growthmodal';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-labelledby','growthtitle');box.innerHTML=`<div class="growthcard reveal"><div class="tag">Forschungsfortschritt ${stage} / 5 • Abzeichen erhalten</div><h2 id="growthtitle">${stage===5?'Gewächshaus wieder einsatzbereit!':'Ein weiterer Auftrag ist geschafft!'}</h2><div class="greenhouse">${growthSVG(stage)}</div>${stage===5?'<p>Aus einem Samen ist eine junge Pflanze geworden.</p>':''}<p class="note">Zeitraffer: In Wirklichkeit dauert die Entwicklung länger. Die Aufgaben schalten Beobachtungen frei; richtige Antworten lassen eine echte Pflanze nicht schneller wachsen.</p><div class="actions"><button id="growthnext">${stage===5?'Gewächshaus öffnen →':'Nächsten Forschungsauftrag starten →'}</button><button class="secondary" id="growthreplay">Animation wiederholen</button><button class="secondary" id="growthback">Zur Aufgabe</button></div></div>`;document.body.appendChild(box);const close=()=>{box.remove();if(lastFocus&&lastFocus.isConnected)lastFocus.focus()};document.getElementById('growthnext').onclick=()=>{close();state.current=stage===5?5:[0,1,2,3,4].find(k=>!state.done.includes(k));render()};document.getElementById('growthback').onclick=close;document.getElementById('growthreplay').onclick=()=>{box.querySelector('.greenhouse').innerHTML=growthSVG(stage)};box.onkeydown=e=>{if(e.key==='Escape'){close();return}if(e.key==='Tab'){const buttons=[...box.querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};document.getElementById('growthnext').focus()}

document.getElementById('reset').onclick=()=>{if(confirm('Möchtest du alle Abzeichen löschen und neu beginnen?')){state={done:[],current:-1};order=[3,0,4,1,2];render()}};render();
</script></html>
